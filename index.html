<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floorplan</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --border: #d5d8dd;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #1a73e8;
      --warn: #b45309;
      --err: #c62828;
      --ok: #2e7d32;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: grid;
      grid-template: 44px 1fr 26px / 1fr 248px;
      grid-template-areas: "top top" "stage panel" "status status";
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    button, select, input { font: inherit; color: inherit; }

    button {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
    }
    button:hover { background: #eef1f5; }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--err); }

    select, input[type=text], input[type=number] {
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    #topbar {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .brand { font-size: 15px; font-weight: 700; margin-right: 6px; color: inherit; text-decoration: none; }
    .brand:hover { text-decoration: underline; }
    .spacer { flex: 1; }
    .inline { display: flex; align-items: center; gap: 4px; color: var(--muted); }
    #planSelect { max-width: 200px; }
    #saveStatus { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    #saveStatus.ok { color: var(--ok); }
    #saveStatus.warn { color: var(--warn); }
    #saveStatus.err { color: var(--err); }

    #tools { display: flex; gap: 4px; padding: 0 10px 0 4px; margin-right: 4px; border-right: 1px solid var(--border); }
    #tools button { display: flex; align-items: center; padding: 4px 6px; }
    #tools button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    #tools svg { display: block; pointer-events: none; }

    #stage { grid-area: stage; position: relative; background: #fff; min-width: 0; min-height: 0; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
    #canvas.tool-select { cursor: default; }
    #canvas.tool-wall, #canvas.tool-door, #canvas.tool-doorway, #canvas.tool-window, #canvas.tool-object { cursor: crosshair; }
    #canvas.panning { cursor: grabbing; }
    #canvas text { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #side {
      grid-area: panel;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
    }
    #panel { flex: 1; min-height: 0; padding: 12px; overflow-y: auto; }
    #layers { padding: 8px 12px 10px; border-top: 1px solid var(--border); }
    .layers-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .layers-head h3 { margin: 0; font-size: 13px; }
    .layer-tools { display: flex; gap: 2px; }
    #layers button { display: flex; padding: 2px; border-color: transparent; background: none; }
    #layers button:hover:not(:disabled) { background: #eef1f5; }
    #layers button.off { color: #b6bcc5; }
    #layers button.on { color: var(--accent); }
    #layers svg { display: block; pointer-events: none; }
    .layer-list { list-style: none; margin: 0; padding: 0; max-height: 26vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
    .layer-list li { display: flex; align-items: center; gap: 2px; padding: 2px 6px 2px 2px; cursor: pointer; }
    .layer-list li + li { border-top: 1px solid var(--border); }
    .layer-list li.active { background: #e3eefd; }
    .layer-list .lname { flex: 1; min-width: 0; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-list .lkind { color: var(--muted); font-size: 11px; }
    .layer-list li.hidden-layer .lname { color: var(--muted); text-decoration: line-through; }
    #panel label.field em { font-style: normal; }
    #panel label.field b.ovr { color: var(--accent); font-size: 9px; vertical-align: 1px; }
    #calc { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
    #calcInput { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
    #calcResult { margin: 4px 2px 8px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
    #calcResult.err { color: var(--muted); font-weight: 400; min-height: 0; }
    #calcKeys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    #calcKeys button { padding: 5px 0; }
    #calcKeys button.primary:hover { background: var(--accent); filter: brightness(1.1); }
    #panel h3 { margin: 0 0 10px; font-size: 13px; }
    #panel p { margin: 0 0 10px; color: var(--muted); }
    #panel label.field { display: grid; grid-template-columns: 1fr 78px 22px; align-items: center; gap: 6px; margin-bottom: 6px; }
    #panel label.field input { width: 100%; text-align: right; }
    #panel label.field select, #panel label.field input[type=text] { width: 100%; grid-column: 2 / 4; }
    #panel label.field input[type=text] { text-align: left; }
    #panel label.field input[type=color] { height: 26px; padding: 2px; }
    #panel h4 { margin: 14px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    #panel label.field span { color: var(--muted); }
    #panel label.note { display: grid; gap: 4px; margin: 10px 0 6px; }
    #panel label.note textarea { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font: inherit; color: inherit; resize: vertical; }
    #panel label.check { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    #panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    #panel .row button { flex: 1 1 auto; }
    .gfont-add { display: flex; gap: 6px; margin-bottom: 8px; }
    .gfont-add input { flex: 1; min-width: 0; }
    details.fold > summary { margin-bottom: 8px; font-weight: 600; cursor: pointer; user-select: none; }
    .hidden-dims { list-style: none; margin: 0 0 10px; padding: 0; border: 1px solid var(--border); border-radius: 6px; max-height: 50vh; overflow-y: auto; }
    .hidden-dims li { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 4px 4px 8px; }
    .hidden-dims li + li { border-top: 1px solid var(--border); }
    .hidden-dims li:hover { background: #eef4fe; }
    .hidden-dims button { padding: 2px 8px; }

    #statusbar {
      grid-area: status;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 0 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    #coords { min-width: 170px; font-variant-numeric: tabular-nums; }

    dialog { border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 300px; }
    dialog::backdrop { background: rgba(0, 0, 0, .3); }
    dialog h3 { margin: 0 0 12px; }
    dialog label { display: grid; gap: 4px; }
    dialog label + label { margin-top: 10px; }
    dialog .hint { max-width: 340px; margin: 12px 0 0; color: var(--muted); }
    dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin: 14px 0 0; }
    .err { color: var(--err); min-height: 1.4em; margin: 6px 0 0; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 44px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 8px;
      background: #1f2328;
      color: #fff;
      z-index: 10;
    }
  </style>
</head>
<body>
  <header id="topbar">
    <a id="brand" class="brand" target="_blank" rel="noopener">Floorplan</a>
    <!-- Tool icons: Material Design Icons (pictogrammers.com), Apache License 2.0 -->
    <nav id="tools">
      <button data-tool="select" title="Select / move (V)" aria-label="Select / move"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M13.64,21.97C13.14,22.21 12.54,22 12.31,21.5L10.13,16.76L7.62,18.78C7.45,18.92 7.24,19 7,19A1,1 0 0,1 6,18V3A1,1 0 0,1 7,2C7.24,2 7.47,2.09 7.64,2.23L7.65,2.22L19.14,11.86C19.57,12.22 19.62,12.85 19.27,13.27C19.12,13.45 18.91,13.57 18.7,13.61L15.54,14.23L17.74,18.96C18,19.46 17.76,20.05 17.26,20.28L13.64,21.97Z"/></svg></button>
      <button data-tool="wall" title="Draw wall rectangle (W)" aria-label="Draw wall rectangle"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3,16H12V21H3V16M2,10H8V15H2V10M9,10H15V15H9V10M16,10H22V15H16V10M13,16H21V21H13V16M3,4H11V9H3V4M12,4H21V9H12V4Z"/></svg></button>
      <button data-tool="door" title="Add door (D)" aria-label="Add door"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16,11H18V13H16V11M12,3H19C20.11,3 21,3.89 21,5V19H22V21H2V19H10V5C10,3.89 10.89,3 12,3M12,5V19H19V5H12Z"/></svg></button>
      <button data-tool="doorway" title="Add doorway without door (O)" aria-label="Add doorway without door"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12,3C10.89,3 10,3.89 10,5H3V19H2V21H22V19H21V5C21,3.89 20.11,3 19,3H12M12,5H19V19H12V5M5,11H7V13H5V11Z"/></svg></button>
      <button data-tool="window" title="Add window (N)" aria-label="Add window"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M21 20V2H3V20H1V23H23V20M19 4V11H13V4M5 4H11V11H5M5 20V13H11V20M13 20V13H19V20Z"/></svg></button>
      <button data-tool="object" title="Add a free object, e.g. furniture (B)" aria-label="Add a free object, e.g. furniture"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M19 9V7C19 5.35 17.65 4 16 4H8C6.35 4 5 5.35 5 7V9C3.35 9 2 10.35 2 12V17C2 18.65 3.35 20 5 20V22H7V20H17V22H19V20C20.65 20 22 18.65 22 17V12C22 10.35 20.65 9 19 9M7 7C7 6.45 7.45 6 8 6H16C16.55 6 17 6.45 17 7V9.78C16.39 10.33 16 11.12 16 12V14H8V12C8 11.12 7.61 10.33 7 9.78V7M20 17C20 17.55 19.55 18 19 18H5C4.45 18 4 17.55 4 17V12C4 11.45 4.45 11 5 11S6 11.45 6 12V16H18V12C18 11.45 18.45 11 19 11S20 11.45 20 12V17Z"/></svg></button>
    </nav>
    <button id="btnFolder" title="Choose the folder where plans are stored">Open folder…</button>
    <select id="planSelect" title="Plan file" disabled></select>
    <button id="btnNew">New plan</button>
    <span id="saveStatus"></span>
    <span class="spacer"></span>
    <button id="btnExport" title="Export the plan as a PNG image or a PDF">Export</button>
    <button id="btnSettings" title="Colours and dimension style of this plan">Settings</button>
    <button id="btnUndo" title="Undo (⌘Z)">Undo</button>
    <button id="btnRedo" title="Redo (⇧⌘Z)">Redo</button>
    <label class="inline">Units
      <select id="unitSelect">
        <option value="mm">mm</option>
        <option value="cm">cm</option>
        <option value="m">m</option>
      </select>
    </label>
    <label class="inline">Snap
      <select id="snapSelect"></select>
    </label>
    <button id="btnZoomOut" title="Zoom out">−</button>
    <button id="btnZoomIn" title="Zoom in">+</button>
    <button id="btnFit" title="Fit plan to window">Fit</button>
  </header>

  <main id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <aside id="side">
    <div id="panel"></div>
    <div id="layers"></div>
    <div id="calc">
      <input id="calcInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Calculator" aria-label="Calculator expression">
      <div id="calcResult">&nbsp;</div>
      <div id="calcKeys">
        <button data-c="clear">C</button><button data-c="(">(</button><button data-c=")">)</button><button data-c="back">⌫</button>
        <button data-c="7">7</button><button data-c="8">8</button><button data-c="9">9</button><button data-c="÷">÷</button>
        <button data-c="4">4</button><button data-c="5">5</button><button data-c="6">6</button><button data-c="×">×</button>
        <button data-c="1">1</button><button data-c="2">2</button><button data-c="3">3</button><button data-c="−">−</button>
        <button data-c="0">0</button><button data-c=".">.</button><button data-c="equals" class="primary">=</button><button data-c="+">+</button>
      </div>
    </div>
  </aside>

  <footer id="statusbar">
    <span id="coords"></span>
    <span id="hint"></span>
  </footer>

  <dialog id="exportDlg">
    <form method="dialog">
      <h3>Export plan</h3>
      <label>Format
        <select id="exportFormat">
          <option value="png">PNG image</option>
          <option value="pdf">PDF document</option>
        </select>
      </label>
      <label>Resolution
        <select id="exportSize">
          <option value="3000">Standard — 3000 px on the long side</option>
          <option value="6000" selected>High — 6000 px</option>
          <option value="10000">Very high — 10000 px</option>
        </select>
      </label>
      <p class="hint">The whole plan is exported without the grid. Text and line sizes relative to the walls are the same as on screen at the current zoom. Hidden layers are left out.</p>
      <menu>
        <button value="cancel" formnovalidate>Cancel</button>
        <button id="exportOk" value="ok" class="primary">Export</button>
      </menu>
    </form>
  </dialog>

  <dialog id="newDlg">
    <form method="dialog">
      <h3>New plan</h3>
      <label>File name <input id="newName" type="text" value="floorplan" autocomplete="off" required></label>
      <p id="newErr" class="err"></p>
      <menu>
        <button value="cancel" formnovalidate>Cancel</button>
        <button id="newOk" value="ok">Create</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
